<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Manifest</title>
<meta name="description" content="A personal packing checklist — one tagged master list, sorted by trip type, then mark each item Packed or Not needed.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manifest">
<meta name="theme-color" content="#F1EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15191A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F1EFE6;
    --surface:#FBFAF5;
    --surface-2:#E7E2D2;
    --border:#D9D3C0;
    --ink:#1E2422;
    --ink-muted:#62685B;
    --accent:#2B615C;
    --accent-strong:#1B413D;
    --accent-soft:#DCE8E4;
    --on-accent:#FFFFFF;
    --gold:#9A6A1F;
    --gold-soft:#F1E1BE;
    --success:#3F7D4E;
    --success-soft:#DDEBDD;
    --muted-status:#7A7669;
    --muted-status-soft:#E8E4D6;
    --danger:#A2432F;
    --danger-soft:#F3DFD8;
    --focus:#2B615C;
    --nav-bg:rgba(241,239,230,0.86);
    --scrim:rgba(20,22,18,0.42);
    --shadow:0 1px 2px rgba(30,36,34,0.05),0 2px 6px rgba(30,36,34,0.04);
    --shadow-lg:0 -8px 32px rgba(30,36,34,0.16);
    --gutter:20px;
    --radius:14px;
    --radius-sm:10px;
  }
  @media (max-width:360px){ :root{ --gutter:16px; } }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15191A;
      --surface:#1E2422;
      --surface-2:#272E2B;
      --border:#37403C;
      --ink:#ECE9E0;
      --ink-muted:#A2A99E;
      --accent:#7FC2B6;
      --accent-strong:#9BD2C8;
      --accent-soft:#223531;
      --on-accent:#0E1F1C;
      --gold:#DDAE5C;
      --gold-soft:#3B2F17;
      --success:#7CC689;
      --success-soft:#20342A;
      --muted-status:#ADB0A2;
      --muted-status-soft:#2A2F29;
      --danger:#E28D74;
      --danger-soft:#3B241D;
      --nav-bg:rgba(21,25,26,0.84);
      --scrim:rgba(0,0,0,0.55);
      --shadow:0 1px 2px rgba(0,0,0,0.3),0 2px 8px rgba(0,0,0,0.2);
      --shadow-lg:0 -8px 32px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15191A;
    --surface:#1E2422;
    --surface-2:#272E2B;
    --border:#37403C;
    --ink:#ECE9E0;
    --ink-muted:#A2A99E;
    --accent:#7FC2B6;
    --accent-strong:#9BD2C8;
    --accent-soft:#223531;
    --on-accent:#0E1F1C;
    --gold:#DDAE5C;
    --gold-soft:#3B2F17;
    --success:#7CC689;
    --success-soft:#20342A;
    --muted-status:#ADB0A2;
    --muted-status-soft:#2A2F29;
    --danger:#E28D74;
    --danger-soft:#3B241D;
    --nav-bg:rgba(21,25,26,0.84);
    --scrim:rgba(0,0,0,0.55);
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 2px 8px rgba(0,0,0,0.2);
    --shadow-lg:0 -8px 32px rgba(0,0,0,0.5);
  }

  /* ---- App shell ----
     Behave like an installed app, not a web page: no pinch/double-tap zoom,
     no text-size inflation, no pull-to-refresh or rubber-band reveal of the
     page behind the nav bar, and no text selection / long-press callouts on
     controls (inputs stay selectable). */
  *{ box-sizing:border-box; }
  html{
    color-scheme:light dark;
    background:var(--bg);
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    touch-action:pan-x pan-y;
    overscroll-behavior-y:none;
  }
  html.modal-open, html.modal-open body{ overflow:hidden; }
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:16px;
    line-height:1.45;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  input, textarea{ -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
  .wrap{
    max-width:640px;
    margin-inline:auto;
    padding-inline:calc(var(--gutter) + env(safe-area-inset-left, 0px)) calc(var(--gutter) + env(safe-area-inset-right, 0px));
    padding-bottom:calc(48px + env(safe-area-inset-bottom, 0px));
  }
  h1,h2,h3{
    font-weight:700;
    line-height:1.15;
    text-wrap:balance;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace; }
  .eyebrow{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-muted);
  }
  a{ color:var(--accent); }
  button{ font-family:inherit; color:inherit; -webkit-appearance:none; appearance:none; touch-action:manipulation; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }

  /* ---- Form controls ----
     16px is the floor: anything smaller makes iOS zoom the page on focus. */
  input[type="text"], input[type="date"], select, textarea{
    font-family:inherit;
    font-size:16px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    min-height:48px;
    width:100%;
    -webkit-appearance:none;
    appearance:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"]:focus, input[type="date"]:focus, textarea:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
  }
  input::placeholder{ color:var(--ink-muted); opacity:.75; }
  input[type="date"]{ display:block; min-width:0; text-align:left; line-height:22px; }
  input[type="date"]::-webkit-date-and-time-value{ text-align:left; }
  .field-label{ font-size:13px; color:var(--ink-muted); font-weight:600; }
  label.field{ display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--ink-muted); font-weight:600; }

  /* ---- Nav bar ----
     Sticky, translucent, and padded under the status bar / notch. The
     compact title (and, on a trip, a hairline progress bar) fades in once
     the large page title has scrolled away. */
  .navbar{
    position:sticky; top:0; z-index:20;
    margin-inline:calc(-1 * (var(--gutter) + env(safe-area-inset-left, 0px))) calc(-1 * (var(--gutter) + env(safe-area-inset-right, 0px)));
    padding:calc(env(safe-area-inset-top, 0px) + 4px) calc(var(--gutter) + env(safe-area-inset-right, 0px)) 4px calc(var(--gutter) + env(safe-area-inset-left, 0px));
    min-height:calc(env(safe-area-inset-top, 0px) + 52px);
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
    background:var(--nav-bg);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid transparent;
    transition:border-color .2s ease;
  }
  .is-scrolled .navbar{ border-bottom-color:var(--border); }
  .nav-left{ justify-self:start; display:flex; align-items:center; min-width:0; }
  .nav-right{ justify-self:end; display:flex; align-items:center; gap:2px; }
  .nav-title{
    font-size:16px; font-weight:600; max-width:46vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    opacity:0; transform:translateY(4px); transition:opacity .2s ease, transform .2s ease;
  }
  .show-nav-title .nav-title{ opacity:1; transform:none; }
  .nav-progress{
    position:absolute; left:0; right:0; bottom:-1px; height:2px; display:flex;
    background:var(--surface-2); opacity:0; transition:opacity .2s ease;
  }
  .nav-progress .fill-packed{ background:var(--success); }
  .nav-progress .fill-ignored{ background:var(--gold); }
  .show-nav-title .nav-progress{ opacity:1; }
  .back-btn{
    display:inline-flex; align-items:center; gap:2px;
    margin-left:-10px; padding:8px 10px 8px 4px; min-height:44px;
    background:none; border:none; color:var(--accent);
    font-size:16px; font-weight:500; cursor:pointer; border-radius:10px;
    transition:opacity .15s ease;
  }
  .back-btn svg{ width:22px; height:22px; }
  .back-btn:active{ opacity:.5; }
  .nav-icon{
    width:42px; height:42px; display:inline-flex; align-items:center; justify-content:center;
    border:none; background:none; color:var(--accent); border-radius:12px; cursor:pointer;
    transition:background-color .15s ease;
  }
  .nav-icon svg{ width:19px; height:19px; }
  .nav-icon:active{ background:var(--accent-soft); }
  .nav-btn{
    background:none; border:none; color:var(--accent); font-size:16px; font-weight:600;
    min-height:44px; padding:8px 4px 8px 10px; cursor:pointer; transition:opacity .15s ease;
  }
  .nav-btn:active{ opacity:.5; }

  .page-head{ margin:4px 0 20px; }
  .page-title{ font-size:30px; letter-spacing:-0.02em; overflow-wrap:anywhere; }
  .page-sub{ margin-top:6px; }

  /* ---- Buttons ---- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:12px; border:1px solid transparent; cursor:pointer;
    font-size:16px; font-weight:600; min-height:50px; padding:0 20px; line-height:1.2;
    transition:transform .12s ease, background-color .15s ease, border-color .15s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--accent); color:var(--on-accent); }
  .btn-primary:active{ background:var(--accent-strong); }
  .btn-secondary{ background:var(--surface); color:var(--ink); border-color:var(--border); }
  .btn-secondary:active{ background:var(--surface-2); }
  .btn-ghost{ background:none; border:none; color:var(--accent); font-weight:600; min-height:44px; padding:0 12px; cursor:pointer; font-size:15px; border-radius:10px; }
  .btn-ghost:active{ background:var(--accent-soft); }
  .btn-sm{ min-height:44px; padding:0 16px; font-size:15px; border-radius:12px; }
  .btn-block{ width:100%; }
  .btn-danger-ghost{ background:none; border:none; color:var(--danger); font-weight:600; min-height:44px; padding:0 4px; cursor:pointer; font-size:15px; }
  .btn-danger-ghost:active{ opacity:.5; }

  /* ---- Grouped lists (shared by every view) ---- */
  .section-title{ margin:28px 4px 8px; }
  .list-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding-inline:16px; box-shadow:var(--shadow);
  }
  .list-link{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
    min-height:54px; padding:0; background:none; border:none; cursor:pointer;
    font-size:16px; font-weight:500; text-align:left; color:var(--ink);
  }
  .list-link svg{ color:var(--ink-muted); flex-shrink:0; }
  .list-link:active{ opacity:.6; }
  .chev{ color:var(--ink-muted); transition:transform .2s ease; flex-shrink:0; }

  /* ---- Home / trip cards ---- */
  .trip-list{ display:flex; flex-direction:column; gap:12px; }
  .trip-card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:14px 12px 16px 16px; box-shadow:var(--shadow); cursor:pointer;
    display:flex; flex-direction:column; gap:12px;
    transition:transform .15s ease, background-color .15s ease;
  }
  .trip-card:active:not(:has(button:active)){ transform:scale(.985); background:var(--surface-2); }
  .trip-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .trip-card-top > div:first-child{ min-width:0; padding-top:2px; }
  .trip-card h3{ font-size:17px; font-weight:600; overflow-wrap:anywhere; }
  .trip-meta{ font-size:13px; color:var(--ink-muted); margin-top:3px; }
  .trip-card .progress-line{ padding-right:4px; }
  .badge{
    font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; font-weight:600;
    letter-spacing:0.04em; text-transform:uppercase;
    background:var(--accent-soft); color:var(--accent-strong); border-radius:999px;
    padding:4px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:55%;
  }
  .card-actions{ display:flex; gap:0; flex-shrink:0; margin-top:-6px; }
  .card-actions button{
    background:none; border:none; color:var(--ink-muted); cursor:pointer;
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    border-radius:10px; transition:background-color .15s ease;
  }
  .card-actions button:active{ background:var(--surface-2); color:var(--ink); }
  .progress-line{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; color:var(--ink-muted); }
  .progress-bar{ height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; display:flex; }
  .progress-bar .fill-packed{ background:var(--success); height:100%; transition:width .35s ease; }
  .progress-bar .fill-ignored{ background:var(--gold); height:100%; transition:width .35s ease; }
  .empty-state{
    border:1.5px dashed var(--border); border-radius:16px; padding:36px 24px;
    text-align:center; color:var(--ink-muted); font-size:15px; margin-top:24px;
  }
  .empty-state strong{ display:block; color:var(--ink); font-size:17px; margin-bottom:6px; }

  /* ---- Trip view ---- */
  .trip-header{ margin:4px 0 8px; }
  .trip-header .trip-meta{ margin-top:6px; }
  .summary-card{
    margin-top:16px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow);
  }
  .summary-text{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; }
  .summary-text span{ display:flex; align-items:center; gap:6px; color:var(--ink-muted); }
  .summary-text strong{ color:var(--ink); font-weight:600; }
  .dot{ width:8px;height:8px;border-radius:50%; display:inline-block; }
  .dot.packed{ background:var(--success); }
  .dot.ignored{ background:var(--gold); }
  .dot.pending{ background:var(--surface-2); border:1px solid var(--border); }
  .link-copy{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    font-size:13px; text-align:left; color:var(--ink); padding:12px 14px; min-height:48px;
    background:var(--surface-2); border:1px solid transparent; border-radius:10px; cursor:pointer;
  }
  .link-copy span{ word-break:break-all; }
  .link-copy svg{ flex-shrink:0; color:var(--ink-muted); }
  .link-copy:active{ border-color:var(--accent); }

  .suggest-card{
    margin-top:16px; background:var(--accent-soft); border:1px solid var(--accent);
    border-radius:var(--radius); padding:14px 16px; display:flex; flex-direction:column; gap:12px;
    font-size:14px; color:var(--accent-strong); line-height:1.45;
  }
  .suggest-actions{ display:flex; gap:8px; align-items:center; }
  .suggest-actions .btn{ min-height:40px; padding:0 16px; font-size:14px; }
  .suggest-actions .btn-ghost{ color:var(--accent-strong); }

  .category{ margin-top:24px; }
  .category-head{ display:flex; justify-content:space-between; align-items:baseline; margin:0 4px 8px; gap:12px; }
  .cat-count{ font-size:12px; color:var(--ink-muted); }
  .item-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    min-height:58px; padding-block:7px; border-bottom:1px solid var(--border);
    transition:opacity .4s ease, transform .4s ease;
  }
  .item-row.row-leaving{ opacity:0; transform:translateX(12px); pointer-events:none; }
  .item-row.row-leaving.to-skip{ transform:translateX(-12px); }
  .item-name{ font-size:16px; min-width:0; overflow-wrap:anywhere; }
  .row-actions{ display:flex; gap:8px; flex-shrink:0; }
  .status-btn{
    width:44px; height:44px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg); cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--ink-muted); transition:background-color .12s ease, border-color .12s ease, color .12s ease, transform .12s ease;
  }
  .status-btn svg{ width:18px; height:18px; }
  .status-btn:active{ transform:scale(.92); }
  .status-btn.pack:active, .row-leaving .status-btn.pack.chosen{ background:var(--success-soft); border-color:var(--success); color:var(--success); }
  .status-btn.skip:active, .row-leaving .status-btn.skip.chosen{ background:var(--gold-soft); border-color:var(--gold); color:var(--gold); }
  .all-done{
    font-size:15px; color:var(--success); min-height:52px; display:flex; align-items:center; gap:8px;
    border-bottom:1px solid var(--border);
  }

  /* Inline "add" row at the foot of a list card — borderless, like the
     last row of a native grouped list. */
  .add-item-form{ display:flex; align-items:center; gap:10px; min-height:52px; }
  .add-item-form input[type="text"]{
    flex:1; border:none; background:transparent; padding:12px 0; min-height:0; border-radius:0; box-shadow:none;
  }
  .add-item-form input[type="text"]:focus{ box-shadow:none; }
  .add-item-form button{
    width:32px; height:32px; flex-shrink:0; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent-soft); color:var(--accent-strong); display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease;
  }
  .add-item-form button:active{ transform:scale(.9); }

  .ledger{ margin-top:12px; }
  .ledgers{ margin-top:32px; }
  .ledger-toggle{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background:none; border:none; min-height:52px; padding:0; cursor:pointer; color:var(--ink);
  }
  .ledger-toggle .eyebrow{ display:flex; align-items:center; gap:8px; }
  .ledger.open .chev{ transform:rotate(90deg); }
  .ledger-body{ display:none; border-top:1px solid var(--border); }
  .ledger.open .ledger-body{ display:block; }
  .ledger-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:48px;
    border-bottom:1px solid var(--border); font-size:15px;
  }
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-row .pill{ display:flex; align-items:center; gap:10px; min-width:0; }
  .ledger-row .pill .dot{ flex-shrink:0; }
  .ledger-row .item-label{ overflow-wrap:anywhere; color:var(--ink-muted); }
  .ledger-empty{ font-size:14px; color:var(--ink-muted); padding:14px 0; }
  .undo-btn{
    background:none; border:none; color:var(--accent); font-size:14px; font-weight:600; cursor:pointer;
    flex-shrink:0; min-height:44px; padding:0 4px 0 12px;
  }
  .undo-btn:active{ opacity:.5; }

  /* ---- Master List view ---- */
  .tpl-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow); }
  .tpl-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:60px; padding:10px 16px; cursor:pointer; }
  .tpl-head:active{ background:var(--surface-2); }
  .tpl-head h3{ font-size:17px; font-weight:600; }
  .tpl-head .trip-meta{ margin-top:1px; }
  .tpl-body{ padding:0 16px 4px; border-top:1px solid var(--border); }
  .tpl-item-row{ display:flex; flex-direction:column; gap:8px; padding-block:12px; border-bottom:1px solid var(--border); }
  .tpl-item-row-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; }
  .tpl-item-name{ font-size:16px; overflow-wrap:anywhere; min-width:0; }
  .add-cat-row{ display:flex; gap:8px; margin-top:12px; }
  .add-cat-row input{ flex:1; }
  .add-cat-row .btn{ flex-shrink:0; }
  .tpl-footer{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding-block:6px; border-top:1px solid var(--border); }
  .icon-x{ background:none; border:none; color:var(--ink-muted); cursor:pointer; width:36px; height:36px; margin-right:-8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:10px; }
  .icon-x:active{ color:var(--danger); background:var(--danger-soft); }
  .hint{ font-size:13px; color:var(--ink-muted); margin:8px 4px 0; line-height:1.4; }

  /* ---- Tags / trip types ---- */
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    display:inline-flex; align-items:center; font-size:13px; font-weight:600;
    min-height:32px; padding:0 12px; border-radius:999px; border:1px solid var(--border);
    background:var(--bg); color:var(--ink-muted); cursor:pointer; white-space:nowrap;
    transition:background-color .12s ease, border-color .12s ease, color .12s ease;
  }
  .chip.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }
  .type-manage-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px; }
  .type-tag{
    display:inline-flex; align-items:center; gap:2px; font-size:14px; font-weight:600;
    min-height:36px; padding:0 4px 0 14px; border-radius:999px; background:var(--surface-2); color:var(--ink);
  }
  .type-tag button{ background:none; border:none; color:var(--ink-muted); cursor:pointer; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
  .type-tag button:active{ color:var(--danger); background:var(--danger-soft); }

  /* ---- Bottom sheet (modal) ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:var(--scrim); display:flex;
    align-items:flex-end; justify-content:center; z-index:50; padding:0;
    overscroll-behavior:contain; animation:fadeIn .2s ease both;
  }
  .modal{
    background:var(--bg); width:100%; max-width:520px; border-radius:20px 20px 0 0;
    padding:8px calc(20px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px));
    max-height:92vh; max-height:92dvh; overflow-y:auto; overscroll-behavior:contain;
    box-shadow:var(--shadow-lg); animation:sheetUp .34s cubic-bezier(.2,.9,.3,1) both;
  }
  .modal::before{
    content:''; display:block; width:36px; height:5px; border-radius:3px;
    background:var(--border); margin:0 auto 16px;
  }
  @media (min-width:560px){
    .modal-backdrop{ align-items:center; padding:24px; }
    .modal{ border-radius:20px; padding:24px; animation:popIn .22s ease both; }
    .modal::before{ display:none; }
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes sheetUp{ from{ transform:translateY(100%); } to{ transform:none; } }
  @keyframes popIn{ from{ opacity:0; transform:scale(.96); } to{ opacity:1; transform:none; } }
  .modal h2{ font-size:22px; letter-spacing:-0.01em; margin-bottom:20px; }
  .modal .field{ margin-bottom:16px; }
  .modal .sheet-note{ font-size:14px; color:var(--ink-muted); margin:-8px 0 16px; }
  .type-pick{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .type-pick label{ position:relative; cursor:pointer; }
  .type-pick input{ position:absolute; opacity:0; width:1px; height:1px; }
  .type-pick .chip{ min-height:40px; padding:0 16px; font-size:14px; }
  .type-pick input:checked + .chip{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }
  .type-pick input:focus-visible + .chip{ outline:2px solid var(--focus); outline-offset:2px; }
  .type-pick-empty{ font-size:14px; color:var(--ink-muted); }
  .date-row{ display:flex; gap:12px; }
  .date-row .field{ flex:1; min-width:0; }
  .days-preview{ font-size:13px; color:var(--ink-muted); margin-top:-6px; margin-bottom:20px; }
  .modal-actions{ display:flex; gap:10px; margin-top:8px; }
  .modal-actions .btn{ flex:1; }
  .export-box{
    width:100%; height:240px; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:13px; line-height:1.4;
    padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    resize:none; margin-bottom:8px;
  }

  /* ---- Toast ---- */
  .toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:var(--bg); font-size:14px; font-weight:600;
    padding:12px 20px; border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.2);
    opacity:0; transition:opacity .25s ease, transform .25s ease;
    z-index:100; pointer-events:none; max-width:calc(100% - 40px); text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- Completion stamp ---- */
  .stamp-overlay{
    position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    background:var(--scrim); opacity:0; animation:stampFadeIn .25s ease forwards; pointer-events:none;
  }
  .stamp-overlay.leaving{ animation:stampFadeOut .45s ease forwards; }
  @keyframes stampFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes stampFadeOut{ from{ opacity:1; } to{ opacity:0; } }
  .stamp-mark{ animation:stampSlam .5s cubic-bezier(.2,1.4,.4,1) both; }
  .stamp-mark.reduced{ animation:stampFadeIn .3s ease both; }
  @keyframes stampSlam{
    0%{ transform:scale(2.4) rotate(-18deg); opacity:0; }
    55%{ transform:scale(.92) rotate(-6deg); opacity:1; }
    75%{ transform:scale(1.05) rotate(-9deg); }
    100%{ transform:scale(1) rotate(-7deg); opacity:1; }
  }
  .stamp-ring{
    width:220px; height:220px; border-radius:50%; border:5px double var(--accent);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    background:var(--accent-soft); color:var(--accent-strong); box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .stamp-check{ width:54px; height:54px; display:flex; align-items:center; justify-content:center; }
  .stamp-check svg{ width:100%; height:100%; }
  .stamp-label{ font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
  .stamp-trip{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.05em;
    max-width:170px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 8px;
  }

  svg{ display:block; }

  @media (prefers-reduced-motion: reduce){
    .modal, .modal-backdrop{ animation:none; }
    .item-row, .item-row.row-leaving{ transform:none; }
    .btn:active, .status-btn:active, .trip-card:active, .add-item-form button:active{ transform:none; }
  }

  /* Hover feedback only for devices with a real pointer — on touch,
     :hover can get "stuck" on whatever element lands under the finger
     after a tap triggers a re-render (looks like a randomly-highlighted
     row). Touch gets :active feedback instead (above). */
  @media (hover: hover) and (pointer: fine){
    .back-btn:hover, .nav-btn:hover{ opacity:.7; }
    .nav-icon:hover{ background:var(--accent-soft); }
    .btn-primary:hover{ background:var(--accent-strong); }
    .btn-secondary:hover{ border-color:var(--ink-muted); }
    .btn-ghost:hover{ background:var(--accent-soft); }
    .trip-card:hover{ border-color:var(--ink-muted); }
    .card-actions button:hover{ background:var(--surface-2); color:var(--ink); }
    .status-btn.pack:hover{ background:var(--success-soft); border-color:var(--success); color:var(--success); }
    .status-btn.skip:hover{ background:var(--gold-soft); border-color:var(--gold); color:var(--gold); }
    .tpl-head:hover{ background:var(--surface-2); }
    .icon-x:hover{ color:var(--danger); background:var(--danger-soft); }
    .type-tag button:hover{ color:var(--danger); background:var(--danger-soft); }
  }

  /* ---- Tag scope labels ----
     Spell out what a tag does ("Only Cold Weather trips") so a stray tap on
     a chip can't silently drop an everyday item from every other trip. */
  .scope{ display:block; font-size:12px; font-weight:500; color:var(--ink-muted); margin-top:1px; }
  .scope.limited{ color:var(--gold); font-weight:600; }
  .left-off-why{ display:block; font-size:12px; color:var(--ink-muted); opacity:.85; }
  .new-trip-preview{ font-size:13px; color:var(--ink-muted); margin:4px 0 18px; }
  .new-trip-preview summary{ cursor:pointer; color:var(--accent); font-weight:600; list-style:none; min-height:32px; display:flex; align-items:center; }
  .new-trip-preview summary::-webkit-details-marker{ display:none; }
  .new-trip-preview ul{ margin:4px 0 0; padding-left:18px; max-height:140px; overflow-y:auto; }
  .new-trip-preview li{ margin:2px 0; }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "manifest.packing.v1";
  var APP_URL = location.origin + location.pathname.replace(/index\.html$/, '');

  var ICONS = {
    check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
    minus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
    back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>',
    chev: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>',
    copy: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>',
    trash: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>',
    gear: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>',
    plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
    x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
    edit: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>'
  };

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // House style for item, category and trip-type names: Title Case, so the
  // list reads the same however each entry was typed ("dress socks",
  // "Dress socks" and "Dress Socks" all become "Dress Socks"). Words that
  // already carry deliberate capitals past the first letter (iPad, USB-C,
  // TSA) are left alone, and short joining words stay lowercase mid-name.
  var MINOR_WORDS = { a:1, an:1, and:1, as:1, at:1, but:1, by:1, for:1, in:1, nor:1, of:1, on:1, or:1, per:1, the:1, to:1, vs:1, via:1, w:1, with:1 };
  function tidyName(s){
    var words = String(s == null ? '' : s).trim().replace(/\s+/g, ' ').split(' ');
    return words.map(function(word, i){
      if (/[A-Z]/.test(word.slice(1))) return word;
      var lower = word.toLowerCase();
      if (i > 0 && i < words.length - 1 && MINOR_WORDS[lower.replace(/[^a-z]/g, '')]) return lower;
      return lower.replace(/(^|[-\/(])([a-z])/g, function(m, pre, ch){ return pre + ch.toUpperCase(); });
    }).join(' ');
  }
  function byName(a, b){
    return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
  }
  var toastTimer = null;
  function showToast(message){
    var el = document.getElementById('toast');
    if (!el){
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      el.setAttribute('aria-live', 'polite');
      document.body.appendChild(el);
    }
    el.textContent = message;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1600);
  }
  function copyToClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject();
      }catch(e){ reject(e); }
    });
  }

  // A single reused AudioContext, created/resumed synchronously inside a
  // click handler so iOS Safari's autoplay policy treats it as user-
  // initiated. Playing on it later (even from a setTimeout) still works
  // once it's been unlocked this way.
  var audioCtx = null;
  function ensureAudio(){
    if (!audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx){ try{ audioCtx = new Ctx(); }catch(e){} }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
  }
  function playStampSound(){
    if (!audioCtx) return;
    try{
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(190, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.16);
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.24);
    }catch(e){}
  }

  // Fires once a trip's last pending item is resolved (packed or set
  // aside) — a full-screen "ink stamp" moment celebrating the finished
  // checklist. Respects prefers-reduced-motion with a shorter, static show.
  function celebrateTripComplete(trip){
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var overlay = document.createElement('div');
    overlay.className = 'stamp-overlay';
    overlay.innerHTML =
      '<div class="stamp-mark' + (reduced ? ' reduced' : '') + '">' +
        '<div class="stamp-ring">' +
          '<span class="stamp-check">' + ICONS.check + '</span>' +
          '<span class="stamp-label">Packed</span>' +
          '<span class="stamp-trip">' + esc(trip.name) + '</span>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    playStampSound();
    if (navigator.vibrate){ try{ navigator.vibrate([15, 40, 15]); }catch(e){} }
    var holdMs = reduced ? 900 : 1400;
    var removeMs = reduced ? 1200 : 1850;
    setTimeout(function(){ overlay.classList.add('leaving'); }, holdMs);
    setTimeout(function(){ overlay.remove(); }, removeMs);
  }

  function defaultTripTypes(){
    return [
      { id: 'cold', name: 'Cold Weather' },
      { id: 'personal', name: 'Personal' },
      { id: 'international', name: 'International' }
    ];
  }

  // Mirrors the user's own curated master list (exported from the live app)
  // so a fresh install starts from their real setup, not a generic one.
  function defaultMaster(){
    function item(name, opts){
      opts = opts || {};
      return { id: uid(), name: name, tags: opts.tags || [] };
    }
    function cat(name, items){ return { id: uid(), name: name, items: items }; }
    return { categories: [
      cat("Clothing", [
        item("Dress Shirts"), item("Underwear"), item("Blazer"), item("Belt"), item("Dress Shoes"), item("Pajamas"),
        item("Chinos"), item("Suit"), item("Socks"), item("Dress Socks"),
        item("Running Shorts"), item("Running Shirt"), item("Running Shoes"),
        item("Casual Shirts"), item("Jacket", {tags:['cold']}), item("Sunnies"),
        item("Thermal Base Layers", {tags:['cold']}), item("Sweaters", {tags:['cold']}),
        item("Gloves", {tags:['cold']}), item("Beanie", {tags:['cold']}),
        item("Shorts"), item("Swimsuit", {tags:['personal']}), item("Flip Flops", {tags:['personal']}), item("Casual Shoes")
      ]),
      cat("Toiletries", [
        item("Deodorant"), item("Toothbrush"), item("Toothpaste"), item("Razor"), item("Mouthwash"), item("Floss"),
        item("Gum Brushes"), item("Comb"), item("Nail File"), item("Nail Clippers"), item("Lint Roller"),
        item("Melatonin", {tags:['international']}),
        item("Lip Balm", {tags:['cold']}), item("Moisturizer", {tags:['cold']}),
        item("Sunscreen", {tags:['personal']}), item("Bug Spray", {tags:['personal']})
      ]),
      cat("Electronics", [
        item("Laptop"), item("Laptop Charger"), item("Phone Charger"), item("Headphones"),
        item("Portable Battery"), item("Outlet Adapter", {tags:['international']}), item("Watch Charger"),
        item("Workout Headphones"), item("Kindle"), item("Mouse"), item("Personal Laptop", {tags:['personal']})
      ]),
      cat("Documents & Work", [
        item("Passport", {tags:['international']}), item("Notebook"), item("Printed Materials"), item("Messenger Bag")
      ]),
      cat("Airplane Needs", [
        item("Dramamine"), item("Neck Pillow"), item("Light Puffy"), item("Eye Mask"),
        item("Ear Plugs"), item("David Bars"), item("Downloaded Shows")
      ])
    ] };
  }

  // Converts the old one-template-per-trip-type schema into a single tagged
  // master list, merging same-named items across templates into one entry
  // tagged with every trip type it appeared under.
  function migrateFromTemplates(old){
    var tripTypes = old.templates.map(function(t){ return { id: t.id, name: t.name }; });
    var categories = [];
    function findCat(name){
      for (var i=0;i<categories.length;i++) if (categories[i].name.toLowerCase() === name.toLowerCase()) return categories[i];
      var created = { id: uid(), name: name, items: [] };
      categories.push(created);
      return created;
    }
    old.templates.forEach(function(tpl){
      tpl.categories.forEach(function(cat){
        var mc = findCat(cat.name);
        cat.items.forEach(function(it){
          var existing = null;
          for (var i=0;i<mc.items.length;i++){
            if (mc.items[i].name.trim().toLowerCase() === it.name.trim().toLowerCase()){ existing = mc.items[i]; break; }
          }
          if (existing){
            if (existing.tags.indexOf(tpl.id) === -1) existing.tags.push(tpl.id);
          } else {
            mc.items.push({ id: uid(), name: it.name, tags: [tpl.id] });
          }
        });
      });
    });
    var trips = (old.trips || []).map(function(t){
      return {
        id: t.id, name: t.name,
        tripTypeIds: t.templateId ? [t.templateId] : [],
        tripTypeNames: t.templateName ? [t.templateName] : [],
        start: t.start, end: t.end, days: t.days, createdAt: t.createdAt,
        items: t.items
      };
    });
    return { tripTypes: tripTypes, master: { categories: categories }, trips: trips };
  }

  function defaultUi(){ return { view: 'home', tripId: null, openLedgers: {}, openCategories: {}, dismissedSuggestions: {} }; }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        if (parsed && parsed.master && parsed.tripTypes && parsed.trips){
          if (!parsed.ui) parsed.ui = defaultUi();
          delete parsed.modal;
          return parsed;
        }
        if (parsed && parsed.templates && parsed.trips){
          var migrated = migrateFromTemplates(parsed);
          var migratedState = { tripTypes: migrated.tripTypes, master: migrated.master, trips: migrated.trips, ui: defaultUi() };
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(migratedState)); }catch(e){}
          return migratedState;
        }
      }
    }catch(e){}
    return { tripTypes: defaultTripTypes(), master: defaultMaster(), trips: [], ui: defaultUi() };
  }
  var state = load();
  if (!state.ui) state.ui = defaultUi();
  if (!state.ui.dismissedSuggestions) state.ui.dismissedSuggestions = {};
  if (!state.ui.openLedgers) state.ui.openLedgers = {};
  if (!state.ui.openCategories) state.ui.openCategories = {};
  if (!state.fixes) state.fixes = {};

  // Applies the Title Case house style to everything already saved, so
  // entries typed before it existed match new ones. Category renames are
  // carried into trips and dismissed-suggestion keys so nothing comes
  // unlinked. Idempotent — safe to run on every launch.
  function normalizeNames(st){
    st.tripTypes.forEach(function(tt){ tt.name = tidyName(tt.name); });
    st.master.categories.forEach(function(c){
      c.name = tidyName(c.name);
      c.items.forEach(function(it){ it.name = tidyName(it.name); });
    });
    st.trips.forEach(function(t){
      t.tripTypeNames = (t.tripTypeNames || []).map(tidyName);
      t.items.forEach(function(it){ it.name = tidyName(it.name); it.category = tidyName(it.category); });
    });
    var ds = st.ui.dismissedSuggestions, next = {};
    Object.keys(ds).forEach(function(k){
      var i = k.indexOf('|');
      next[i === -1 ? k : tidyName(k.slice(0, i)) + k.slice(i)] = ds[k];
    });
    st.ui.dismissedSuggestions = next;
  }
  normalizeNames(state);

  // One-time repair: "Phone Charger" was tagged Cold Weather by mistake,
  // which kept it off every other trip. Make it universal again and add it
  // to any current or upcoming trip that's missing it.
  if (!state.fixes.phoneChargerUniversal){
    state.fixes.phoneChargerUniversal = true;
    var chargerFixed = false;
    state.master.categories.forEach(function(c){
      c.items.forEach(function(it){
        if (it.name.toLowerCase() === 'phone charger' && it.tags && it.tags.length){ it.tags = []; chargerFixed = true; }
      });
    });
    if (chargerFixed){
      var fixToday = todayIso();
      state.trips.forEach(function(t){ if (t.end >= fixToday) syncTripWithMaster(t); });
    }
  }

  // The open sheet is transient UI, never persisted — a reload shouldn't
  // reopen a half-filled form.
  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state, function(k, v){ return k === 'modal' ? undefined : v; }));
    }catch(e){}
  }

  function fmtDate(iso){
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }
  function fmtRange(start, end){
    if (!start) return '';
    var s = new Date(start + 'T00:00:00');
    var opts = { month:'short', day:'numeric' };
    if (!end || end === start) return s.toLocaleDateString(undefined, opts);
    var e = new Date(end + 'T00:00:00');
    if (s.getFullYear() === e.getFullYear() && s.getMonth() === e.getMonth()){
      // "Oct 20–23, 2026" rather than "20–Oct 23, 2026".
      return s.toLocaleDateString(undefined, opts) + '–' + e.getDate() + ', ' + e.getFullYear();
    }
    var startOpts = s.getFullYear() === e.getFullYear() ? opts : { month:'short', day:'numeric', year:'numeric' };
    return s.toLocaleDateString(undefined, startOpts) + ' – ' + e.toLocaleDateString(undefined, opts) + ', ' + e.getFullYear();
  }
  function daysBetween(start, end){
    if (!start || !end) return 1;
    var a = new Date(start + 'T00:00:00'), b = new Date(end + 'T00:00:00');
    var diff = Math.round((b - a) / 86400000) + 1;
    return Math.max(1, diff);
  }
  function todayIso(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function addDaysIso(iso, n){
    var d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function getTrip(id){
    for (var i=0;i<state.trips.length;i++) if (state.trips[i].id === id) return state.trips[i];
    return null;
  }
  function getTripType(id){
    for (var i=0;i<state.tripTypes.length;i++) if (state.tripTypes[i].id === id) return state.tripTypes[i];
    return null;
  }
  function tripTypeName(id){
    var t = getTripType(id);
    return t ? t.name : id;
  }
  function tripBadge(t){
    return (t.tripTypeNames && t.tripTypeNames.length) ? t.tripTypeNames.join(' + ') : 'General';
  }
  function tripCounts(trip){
    var packed=0, ignored=0, total=trip.items.length;
    trip.items.forEach(function(it){ if (it.status==='packed') packed++; else if (it.status==='ignored') ignored++; });
    return { packed:packed, ignored:ignored, total:total, pending: total-packed-ignored };
  }

  // An item with no tags is universal and goes on every trip. A tagged item
  // (e.g. "cold" or "personal") is only included when the trip itself is
  // tagged with a matching type — tags gate inclusion, not just order.
  function buildTripFromMaster(tripTypeIds, name, start, end){
    var days = daysBetween(start, end);
    var items = [];
    state.master.categories.forEach(function(cat){
      cat.items.forEach(function(it){
        var tags = it.tags || [];
        var isUniversal = tags.length === 0;
        var isSelected = tags.some(function(t){ return tripTypeIds.indexOf(t) !== -1; });
        if (isUniversal || isSelected){
          items.push({ id: uid(), name: it.name, category: cat.name, tags: tags.slice(), status: 'pending' });
        }
      });
    });
    return { id: uid(), name: name, tripTypeIds: tripTypeIds.slice(), tripTypeNames: tripTypeIds.map(tripTypeName), start: start, end: end, days: days, createdAt: Date.now(), items: items };
  }
  function sortPending(items){
    return items.slice().sort(byName);
  }

  // Adds any master-list item that newly qualifies under trip.tripTypeIds
  // (universal, or tagged with a now-selected type) and isn't already on the
  // trip. Never removes anything already there — editing a trip's types is
  // additive only, so packed/ignored decisions are never disturbed.
  function syncTripWithMaster(trip){
    var existingKeys = {};
    trip.items.forEach(function(it){ existingKeys[it.category + '|' + it.name.toLowerCase()] = true; });
    state.master.categories.forEach(function(cat){
      cat.items.forEach(function(it){
        var tags = it.tags || [];
        var isUniversal = tags.length === 0;
        var isSelected = tags.some(function(t){ return trip.tripTypeIds.indexOf(t) !== -1; });
        var key = cat.name + '|' + it.name.toLowerCase();
        if ((isUniversal || isSelected) && !existingKeys[key]){
          trip.items.push({ id: uid(), name: it.name, category: cat.name, tags: tags.slice(), status: 'pending' });
          existingKeys[key] = true;
        }
      });
    });
  }

  // Finds an item that's not on the master list but has been added by hand
  // to 2+ different trips (including this one) — a sign it belongs on the
  // master list permanently. Returns the one with the most trips, skipping
  // anything already dismissed for this key.
  function findRecurringSuggestion(trip){
    var masterKeys = {};
    state.master.categories.forEach(function(cat){
      cat.items.forEach(function(it){ masterKeys[cat.name + '|' + it.name.toLowerCase()] = true; });
    });
    var tripsByKey = {};
    state.trips.forEach(function(t){
      var seen = {};
      t.items.forEach(function(it){
        var key = it.category + '|' + it.name.toLowerCase();
        if (masterKeys[key] || seen[key]) return;
        seen[key] = true;
        tripsByKey[key] = (tripsByKey[key] || 0) + 1;
      });
    });
    var best = null;
    trip.items.forEach(function(it){
      var key = it.category + '|' + it.name.toLowerCase();
      if (masterKeys[key] || state.ui.dismissedSuggestions[key]) return;
      var count = tripsByKey[key] || 0;
      if (count >= 2 && (!best || count > best.count)){
        best = { key: key, name: it.name, category: it.category, count: count };
      }
    });
    return best;
  }

  // Master-list items that aren't on this trip — almost always because
  // they're tagged for a trip type the trip doesn't have. Surfacing them
  // makes a mis-tagged everyday item easy to spot and add back.
  function itemsLeftOffTrip(trip){
    var onTrip = {};
    trip.items.forEach(function(it){ onTrip[it.category + '|' + it.name.toLowerCase()] = true; });
    var out = [];
    state.master.categories.forEach(function(cat){
      cat.items.forEach(function(it){
        if (!onTrip[cat.name + '|' + it.name.toLowerCase()]) out.push({ name: it.name, category: cat.name, tags: it.tags || [] });
      });
    });
    return out.sort(byName);
  }
  function scopeLabel(tags){
    if (!tags || !tags.length) return 'Every trip';
    return 'Only ' + tags.map(tripTypeName).join(' or ') + ' trips';
  }
  function countForTypes(tripTypeIds){
    var included = 0, left = [];
    state.master.categories.forEach(function(cat){
      cat.items.forEach(function(it){
        var tags = it.tags || [];
        if (!tags.length || tags.some(function(t){ return tripTypeIds.indexOf(t) !== -1; })) included++;
        else left.push(it);
      });
    });
    return { included: included, left: left.sort(byName) };
  }

  // ---------- Rendering ----------
  var app = document.getElementById('app');
  var leavingRows = {};

  function render(){
    var ui = state.ui;
    if (ui.view === 'trip' && !getTrip(ui.tripId)){ ui.view = 'home'; ui.tripId = null; }
    var html = '';
    if (ui.view === 'home') html = renderHome();
    else if (ui.view === 'trip') html = renderTrip(getTrip(ui.tripId));
    else if (ui.view === 'master') html = renderMasterList();
    else if (ui.view === 'settings') html = renderSettings();
    app.innerHTML = html;

    document.documentElement.classList.toggle('modal-open', !!state.modal);
    if (state.modal) renderModal();
    updateScrollState();
  }

  function updateScrollState(){
    var y = window.scrollY || 0;
    document.documentElement.classList.toggle('is-scrolled', y > 4);
    document.documentElement.classList.toggle('show-nav-title', y > 56);
  }
  window.addEventListener('scroll', updateScrollState, { passive: true });

  function navbar(left, title, right, extra){
    return '<header class="navbar">' +
      '<div class="nav-left">' + (left || '') + '</div>' +
      '<div class="nav-title" aria-hidden="true">' + esc(title) + '</div>' +
      '<div class="nav-right">' + (right || '') + '</div>' +
      (extra || '') +
    '</header>';
  }
  function backBtn(label){
    return '<button class="back-btn" data-action="go-back">' + ICONS.back + '<span>' + esc(label) + '</span></button>';
  }
  function progressFill(c, cls){
    var packedPct = c.total ? (c.packed / c.total * 100) : 0;
    var ignoredPct = c.total ? (c.ignored / c.total * 100) : 0;
    return '<div class="' + cls + '"><div class="fill-packed" style="width:' + packedPct + '%"></div><div class="fill-ignored" style="width:' + ignoredPct + '%"></div></div>';
  }
  function dayCount(n){ return n + (n === 1 ? ' day' : ' days'); }

  function renderHome(){
    var today = todayIso();
    var trips = state.trips.slice().sort(function(a,b){
      var aUp = a.end >= today, bUp = b.end >= today;
      if (aUp !== bUp) return aUp ? -1 : 1;
      if (aUp) return a.start < b.start ? -1 : 1;
      return b.start < a.start ? -1 : 1;
    });

    var out = navbar('', 'Manifest', '<button class="nav-icon" data-action="open-settings" aria-label="Settings" title="Settings">' + ICONS.gear + '</button>');
    out += '<div class="page-head"><h1 class="page-title">Manifest</h1><div class="eyebrow page-sub">Packing, sorted</div></div>';
    out += '<button class="btn btn-primary btn-block" data-action="open-new-trip">' + ICONS.plus + ' New Trip</button>';

    if (trips.length === 0){
      out += '<div class="empty-state"><strong>No trips yet</strong>Start one and Manifest will build your checklist from your master list.</div>';
      return out;
    }

    var upcoming = trips.filter(function(t){ return t.end >= today; });
    var past = trips.filter(function(t){ return t.end < today; });

    if (upcoming.length){
      out += '<div class="section-title eyebrow">Upcoming</div><div class="trip-list">';
      upcoming.forEach(function(t){ out += tripCard(t); });
      out += '</div>';
    }
    if (past.length){
      out += '<div class="section-title eyebrow">Past trips</div><div class="trip-list">';
      past.forEach(function(t){ out += tripCard(t); });
      out += '</div>';
    }
    return out;
  }

  function tripCard(t){
    var c = tripCounts(t);
    var status = c.pending === 0 ? 'All packed' : c.packed + ' of ' + c.total + ' packed · ' + c.pending + ' to go';
    return '<div class="trip-card" data-action="open-trip" data-id="' + t.id + '">' +
      '<div class="trip-card-top">' +
        '<div><h3>' + esc(t.name) + '</h3><div class="trip-meta mono">' + esc(fmtRange(t.start,t.end)) + ' · ' + dayCount(t.days) + '</div></div>' +
        '<div class="card-actions">' +
          '<button data-action="clone-trip" data-id="' + t.id + '" aria-label="Duplicate trip" title="Duplicate">' + ICONS.copy + '</button>' +
          '<button data-action="delete-trip" data-id="' + t.id + '" aria-label="Delete trip" title="Delete">' + ICONS.trash + '</button>' +
        '</div>' +
      '</div>' +
      progressFill(c, 'progress-bar') +
      '<div class="progress-line"><span>' + status + '</span><span class="badge">' + esc(tripBadge(t)) + '</span></div>' +
    '</div>';
  }

  function renderTrip(trip){
    var c = tripCounts(trip);

    var actions =
      '<button class="nav-icon" data-action="open-edit-trip" data-id="' + trip.id + '" aria-label="Edit trip" title="Edit trip">' + ICONS.edit + '</button>' +
      '<button class="nav-icon" data-action="clone-trip" data-id="' + trip.id + '" aria-label="Duplicate trip" title="Duplicate">' + ICONS.copy + '</button>' +
      '<button class="nav-icon" data-action="delete-trip" data-id="' + trip.id + '" aria-label="Delete trip" title="Delete">' + ICONS.trash + '</button>';
    var out = navbar(backBtn('Trips'), trip.name, actions, progressFill(c, 'nav-progress'));

    out += '<div class="trip-header">' +
      '<h1 class="page-title">' + esc(trip.name) + '</h1>' +
      '<div class="trip-meta mono">' + esc(fmtRange(trip.start, trip.end)) + ' · ' + dayCount(trip.days) + ' · ' + esc(tripBadge(trip)) + '</div>' +
      '<div class="summary-card">' +
        progressFill(c, 'progress-bar') +
        '<div class="summary-text">' +
          '<span><span class="dot packed"></span><strong>' + c.packed + '</strong> packed</span>' +
          '<span><span class="dot ignored"></span><strong>' + c.ignored + '</strong> not needed</span>' +
          '<span><span class="dot pending"></span><strong>' + c.pending + '</strong> to go</span>' +
        '</div>' +
      '</div>' +
    '</div>';

    var suggestion = findRecurringSuggestion(trip);
    if (suggestion){
      out += '<div class="suggest-card">' +
        '<span>You\'ve added <strong>' + esc(suggestion.name) + '</strong> by hand on ' + suggestion.count + ' trips. Add it to your master list?</span>' +
        '<div class="suggest-actions">' +
          '<button class="btn btn-primary" data-action="accept-suggestion" data-key="' + esc(suggestion.key) + '" data-name="' + esc(suggestion.name) + '" data-cat="' + esc(suggestion.category) + '">Add to Master List</button>' +
          '<button class="btn-ghost" data-action="dismiss-suggestion" data-key="' + esc(suggestion.key) + '">Not Now</button>' +
        '</div>' +
      '</div>';
    }

    var byCat = {};
    var order = [];
    trip.items.forEach(function(it){
      if (!byCat[it.category]){ byCat[it.category] = []; order.push(it.category); }
      byCat[it.category].push(it);
    });

    order.forEach(function(catName){
      var items = byCat[catName];
      var pending = sortPending(items.filter(function(it){ return it.status === 'pending'; }));
      out += '<section class="category"><div class="category-head"><h2 class="eyebrow">' + esc(catName) + '</h2>' +
        '<span class="cat-count mono">' + (pending.length ? pending.length + ' to go' : 'Done') + '</span></div><div class="list-card">';
      if (pending.length === 0){
        out += '<div class="all-done">' + ICONS.check + ' All set in ' + esc(catName) + '</div>';
      } else {
        pending.forEach(function(it){ out += itemRow(it); });
      }
      out += addRow('add-item', 'data-trip="' + trip.id + '" data-cat="' + esc(catName) + '"', 'Add to ' + catName);
      out += '</div></section>';
    });

    var packedItems = sortPending(trip.items.filter(function(it){ return it.status === 'packed'; }));
    var ignoredItems = sortPending(trip.items.filter(function(it){ return it.status === 'ignored'; }));

    out += '<div class="ledgers">';
    out += ledger('packed', trip.id, 'Packed', packedItems.length, ledgerRows(packedItems, 'packed'));
    out += ledger('ignored', trip.id, 'Not needed', ignoredItems.length, ledgerRows(ignoredItems, 'ignored'));
    var leftOff = itemsLeftOffTrip(trip);
    out += ledger('leftoff', trip.id, 'Left off this trip', leftOff.length, leftOff.map(function(x){
      return '<div class="ledger-row"><span class="pill"><span class="item-label">' + esc(x.name) +
          '<span class="left-off-why">' + esc(x.category) + ' · ' + esc(scopeLabel(x.tags)) + '</span></span></span>' +
        '<button class="undo-btn" data-action="add-left-off" data-name="' + esc(x.name) + '" data-cat="' + esc(x.category) + '">Add</button></div>';
    }).join(''), 'Everything on your master list is on this trip.');
    out += '</div>';
    out += '<p class="hint">"Left off" lists master-list items tagged for trip types this trip doesn\'t have. Add any one back with a tap, or edit the trip to change its types.</p>';

    return out;
  }

  function addRow(action, attrs, placeholder){
    return '<form class="add-item-form" data-action="' + action + '" ' + attrs + '>' +
      '<input type="text" name="itemName" placeholder="' + esc(placeholder) + '" aria-label="' + esc(placeholder) + '" autocomplete="off" autocapitalize="words" enterkeyhint="done">' +
      '<button type="submit" aria-label="Add">' + ICONS.plus + '</button></form>';
  }

  function itemRow(it){
    var leaving = leavingRows[it.id];
    return '<div class="item-row' + (leaving ? ' row-leaving' + (leaving === 'ignored' ? ' to-skip' : '') : '') + '" data-row-item="' + it.id + '">' +
      '<span class="item-name">' + esc(it.name) + '</span>' +
      '<span class="row-actions">' +
        '<button class="status-btn skip' + (leaving === 'ignored' ? ' chosen' : '') + '" data-action="set-status" data-item="' + it.id + '" data-status="ignored" aria-label="Not needed: ' + esc(it.name) + '" title="Not needed">' + ICONS.minus + '</button>' +
        '<button class="status-btn pack' + (leaving === 'packed' ? ' chosen' : '') + '" data-action="set-status" data-item="' + it.id + '" data-status="packed" aria-label="Packed: ' + esc(it.name) + '" title="Packed">' + ICONS.check + '</button>' +
      '</span>' +
    '</div>';
  }

  function ledgerRows(items, dotClass){
    return items.map(function(it){
      return '<div class="ledger-row"><span class="pill"><span class="dot ' + dotClass + '"></span><span class="item-label">' + esc(it.name) + '</span></span>' +
        '<button class="undo-btn" data-action="set-status" data-item="' + it.id + '" data-status="pending">Undo</button></div>';
    }).join('');
  }

  function ledger(key, tripId, label, count, rowsHtml, emptyText){
    var open = state.ui.openLedgers[tripId + ':' + key];
    return '<div class="ledger list-card' + (open ? ' open' : '') + '">' +
      '<button class="ledger-toggle" data-action="toggle-ledger" data-key="' + tripId + ':' + key + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
        '<span class="eyebrow">' + esc(label) + ' (' + count + ')</span><span class="chev">' + ICONS.chev + '</span>' +
      '</button>' +
      '<div class="ledger-body">' + (count ? rowsHtml : '<div class="ledger-empty">' + esc(emptyText || 'Nothing here yet.') + '</div>') + '</div>' +
    '</div>';
  }

  function renderSettings(){
    var out = navbar(backBtn('Trips'), 'Settings', '');
    out += '<div class="page-head"><h1 class="page-title">Settings</h1></div>';

    out += '<div class="section-title eyebrow" style="margin-top:0;">Packing list</div>';
    out += '<div class="list-card"><button class="list-link" data-action="open-master"><span>Master list &amp; trip types</span>' + ICONS.chev + '</button></div>';
    out += '<p class="hint">Every trip is built from your master list. Untagged items go on every trip; tagged items only join trips of that type.</p>';

    out += '<div class="section-title eyebrow">Share Manifest</div>';
    out += '<div class="summary-card" style="margin-top:0;">' +
      '<div class="trip-meta" style="margin-top:0;">This link opens the app itself. Each person who opens it gets their own private checklist on their own device, not a copy of yours.</div>' +
      '<button type="button" class="link-copy mono" data-action="copy-link" aria-label="Copy link">' +
        '<span>' + esc(APP_URL) + '</span>' + ICONS.copy +
      '</button>' +
      '<button class="btn btn-primary btn-block" data-action="share-app">Share Link</button>' +
    '</div>';
    return out;
  }

  function renderMasterList(){
    var out = navbar(backBtn('Settings'), 'Master List', '<button class="nav-btn" data-action="export-master">Export</button>');
    out += '<div class="page-head"><h1 class="page-title">Master List</h1></div>';

    out += '<div class="section-title eyebrow" style="margin-top:0;">Trip types</div>';
    out += '<div class="type-manage-row">' + state.tripTypes.map(function(tt){
      return '<span class="type-tag">' + esc(tt.name) + '<button data-action="delete-type" data-id="' + tt.id + '" aria-label="Remove ' + esc(tt.name) + '">' + ICONS.x + '</button></span>';
    }).join('') + '</div>';
    out += '<form class="add-cat-row" data-action="add-type">' +
      '<input type="text" name="typeName" placeholder="New trip type (e.g. Camping)" aria-label="New trip type" autocomplete="off" autocapitalize="words">' +
      '<button type="submit" class="btn btn-secondary btn-sm">Add</button></form>';
    out += '<p class="hint"><strong>Untagged items go on every trip.</strong> Tagging an item with a trip type limits it to trips of that type, so only tag things you\'d leave behind otherwise.</p>';

    out += '<div class="section-title eyebrow">Categories</div>';
    state.master.categories.forEach(function(cat){ out += masterCategoryCard(cat); });

    out += '<form class="add-cat-row" data-action="add-master-category">' +
      '<input type="text" name="catName" placeholder="New category (e.g. Sports Gear)" aria-label="New category" autocomplete="off" autocapitalize="words">' +
      '<button type="submit" class="btn btn-secondary btn-sm">Add</button></form>';
    return out;
  }

  function masterCategoryCard(cat){
    var open = state.ui.openCategories[cat.id] !== false;
    var limited = cat.items.filter(function(it){ return it.tags && it.tags.length; }).length;
    var out = '<div class="tpl-card">';
    out += '<div class="tpl-head" data-action="toggle-category" data-id="' + cat.id + '" role="button" aria-expanded="' + (open ? 'true' : 'false') + '">' +
      '<div><h3>' + esc(cat.name) + '</h3><div class="trip-meta">' + cat.items.length + (cat.items.length === 1 ? ' item' : ' items') +
        (limited ? ' · ' + limited + ' trip-specific' : '') + '</div></div>' +
      '<span class="chev" style="' + (open?'transform:rotate(90deg);':'') + '">' + ICONS.chev + '</span>' +
    '</div>';
    if (open){
      out += '<div class="tpl-body">';
      cat.items.slice().sort(byName).forEach(function(it){ out += masterItemRow(cat.id, it); });
      out += addRow('add-master-item', 'data-cat="' + cat.id + '"', 'Add to ' + cat.name);
      out += '<div class="tpl-footer"><span class="trip-meta" style="margin:0;">Tap a type to limit an item to it.</span>' +
        '<button class="btn-danger-ghost" data-action="delete-master-category" data-id="' + cat.id + '">Delete</button></div>';
      out += '</div>';
    }
    out += '</div>';
    return out;
  }

  function masterItemRow(catId, it){
    var tags = it.tags || [];
    var tagsHtml = state.tripTypes.map(function(tt){
      var active = tags.indexOf(tt.id) !== -1;
      return '<button type="button" class="chip' + (active?' active':'') + '" data-action="toggle-item-tag" data-cat="' + catId + '" data-item="' + it.id + '" data-type="' + tt.id + '" aria-pressed="' + (active ? 'true' : 'false') + '">' + esc(tt.name) + '</button>';
    }).join('');
    return '<div class="tpl-item-row">' +
      '<div class="tpl-item-row-top">' +
        '<span class="tpl-item-name">' + esc(it.name) +
          '<span class="scope' + (tags.length ? ' limited' : '') + '">' + esc(scopeLabel(tags)) + '</span></span>' +
        '<button class="icon-x" data-action="delete-master-item" data-cat="' + catId + '" data-item="' + it.id + '" aria-label="Delete ' + esc(it.name) + '">' + ICONS.x + '</button>' +
      '</div>' +
      (state.tripTypes.length ? '<div class="chip-row">' + tagsHtml + '</div>' : '') +
    '</div>';
  }

  // ---------- Modal ----------
  function renderModal(){
    var m = state.modal;
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.setAttribute('data-action', 'close-modal-backdrop');
    var box = document.createElement('div');
    box.className = 'modal';

    if (m.type === 'newTrip'){
      var start = todayIso();
      var end = addDaysIso(start, 4);
      box.innerHTML = '<h2>New Trip</h2>' +
        '<form id="new-trip-form">' +
          '<div class="field" style="margin-bottom:8px;"><span class="field-label">Trip type <span class="trip-meta" style="display:inline;font-weight:400;">(optional, pick any that apply)</span></span></div>' +
          '<div class="type-pick">' + (state.tripTypes.length ? state.tripTypes.map(function(tt){
            return '<label><input type="checkbox" name="tripTypes" value="' + tt.id + '"><span class="chip">' + esc(tt.name) + '</span></label>';
          }).join('') : '<span class="type-pick-empty">No trip types yet — add some from the Master List.</span>') + '</div>' +
          '<div class="new-trip-preview" id="ntPreview"></div>' +
          '<label class="field">Trip name<input type="text" name="tripName" placeholder="e.g. Chicago Client Visit" required autocomplete="off" autocapitalize="words" enterkeyhint="done"></label>' +
          '<div class="date-row">' +
            '<label class="field">Start<input type="date" id="ntStart" name="start" value="' + start + '" required></label>' +
            '<label class="field">End<input type="date" id="ntEnd" name="end" value="' + end + '" required></label>' +
          '</div>' +
          '<div class="days-preview mono" id="ntDaysPreview">' + dayCount(daysBetween(start,end)) + '</div>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">Create Trip</button>' +
          '</div>' +
        '</form>';
    }

    if (m.type === 'editTrip'){
      var editTrip = getTrip(m.tripId);
      box.innerHTML = '<h2>Edit Trip</h2>' +
        '<form id="edit-trip-form">' +
          '<div class="field" style="margin-bottom:8px;"><span class="field-label">Trip type <span class="trip-meta" style="display:inline;font-weight:400;">(optional, pick any that apply)</span></span></div>' +
          '<div class="type-pick">' + (state.tripTypes.length ? state.tripTypes.map(function(tt){
            var checked = editTrip.tripTypeIds.indexOf(tt.id) !== -1;
            return '<label><input type="checkbox" name="tripTypes" value="' + tt.id + '"' + (checked ? ' checked' : '') + '><span class="chip">' + esc(tt.name) + '</span></label>';
          }).join('') : '<span class="type-pick-empty">No trip types yet — add some from the Master List.</span>') + '</div>' +
          '<div class="trip-meta" style="margin:0 0 18px;">Adding a type brings in its items. Nothing already on your list gets removed.</div>' +
          '<label class="field">Trip name<input type="text" name="tripName" value="' + esc(editTrip.name) + '" required autocomplete="off" autocapitalize="words" enterkeyhint="done"></label>' +
          '<div class="date-row">' +
            '<label class="field">Start<input type="date" id="etStart" name="start" value="' + editTrip.start + '" required></label>' +
            '<label class="field">End<input type="date" id="etEnd" name="end" value="' + editTrip.end + '" required></label>' +
          '</div>' +
          '<div class="days-preview mono" id="etDaysPreview">' + dayCount(editTrip.days) + '</div>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">Save Changes</button>' +
          '</div>' +
        '</form>';
    }

    if (m.type === 'export'){
      box.innerHTML = '<h2>Export Master List</h2>' +
        '<p class="sheet-note">Copy this and send it to Claude to lock it in as the app\'s built-in defaults.</p>' +
        '<button type="button" class="btn btn-primary btn-block" data-action="copy-export" style="margin-bottom:12px;">Copy All</button>' +
        '<textarea id="exportBox" class="export-box" readonly aria-label="Master list export">' + esc(m.json) + '</textarea>' +
        '<div class="modal-actions"><button type="button" class="btn btn-secondary btn-block" data-action="close-modal">Done</button></div>';
    }

    backdrop.appendChild(box);
    app.appendChild(backdrop);

    if (m.type === 'newTrip'){
      var sEl = box.querySelector('#ntStart'), eEl = box.querySelector('#ntEnd'), pEl = box.querySelector('#ntDaysPreview');
      var ntForm = box.querySelector('#new-trip-form'), ntPreview = box.querySelector('#ntPreview');
      function updatePreview(){
        pEl.textContent = dayCount(daysBetween(sEl.value, eEl.value));
      }
      // Shows exactly what the chosen types will include and leave out,
      // before the trip exists — the moment a mis-tagged item is cheapest
      // to notice.
      function updateTypePreview(){
        var ids = Array.prototype.map.call(ntForm.querySelectorAll('input[name="tripTypes"]:checked'), function(i){ return i.value; });
        var r = countForTypes(ids);
        var html = '<strong>' + r.included + ' items</strong> will be on this trip';
        if (r.left.length){
          html += '<details><summary>' + r.left.length + ' left out (tagged for other trip types)</summary><ul>' +
            r.left.map(function(it){ return '<li>' + esc(it.name) + ' <span style="opacity:.7">· ' + esc(scopeLabel(it.tags)) + '</span></li>'; }).join('') +
          '</ul></details>';
        }
        ntPreview.innerHTML = html;
      }
      updateTypePreview();
      ntForm.addEventListener('change', function(e){ if (e.target.name === 'tripTypes') updateTypePreview(); });
      sEl.addEventListener('input', updatePreview);
      eEl.addEventListener('input', updatePreview);
      box.querySelector('#new-trip-form').addEventListener('submit', function(e){
        e.preventDefault();
        var fd = new FormData(e.target);
        var tripTypeIds = fd.getAll('tripTypes');
        var name = (fd.get('tripName') || '').trim() || 'Trip';
        var start = fd.get('start') || todayIso(), end = fd.get('end') || start;
        if (end < start) end = start;
        var trip = buildTripFromMaster(tripTypeIds, name, start, end);
        state.trips.push(trip);
        state.modal = null;
        // The sheet's history entry becomes the new trip's, so Back from
        // the trip lands on the home screen, not on a closed sheet.
        navTo('trip', trip.id, true);
      });
    }

    if (m.type === 'editTrip'){
      var etSEl = box.querySelector('#etStart'), etEEl = box.querySelector('#etEnd'), etPEl = box.querySelector('#etDaysPreview');
      function updateEtPreview(){
        etPEl.textContent = dayCount(daysBetween(etSEl.value, etEEl.value));
      }
      etSEl.addEventListener('input', updateEtPreview);
      etEEl.addEventListener('input', updateEtPreview);
      box.querySelector('#edit-trip-form').addEventListener('submit', function(e){
        e.preventDefault();
        var trip = getTrip(m.tripId);
        if (!trip){ closeModal(); return; }
        var fd = new FormData(e.target);
        var tripTypeIds = fd.getAll('tripTypes');
        var name = (fd.get('tripName') || '').trim() || trip.name;
        var start = fd.get('start') || trip.start, end = fd.get('end') || start;
        if (end < start) end = start;
        trip.name = name;
        trip.start = start;
        trip.end = end;
        trip.days = daysBetween(start, end);
        trip.tripTypeIds = tripTypeIds;
        trip.tripTypeNames = tripTypeIds.map(tripTypeName);
        syncTripWithMaster(trip);
        save();
        closeModal();
      });
    }
  }

  // ---------- Navigation ----------
  // Each screen change and each open sheet gets its own browser-history
  // entry, so the phone's Back gesture/button steps back through the app
  // instead of leaving it. `depth` counts entries this session pushed, so
  // the in-app back button knows whether history.back() stays in the app.
  var PARENT_VIEW = { trip: 'home', settings: 'home', master: 'settings' };
  function curDepth(){ return (history.state && history.state.depth) || 0; }
  function rememberScroll(){
    try{ history.replaceState(Object.assign({}, history.state, { y: window.scrollY }), ''); }catch(e){}
  }
  function navTo(view, tripId, replace){
    var depth = curDepth();
    if (!replace) rememberScroll();
    state.ui.view = view;
    state.ui.tripId = tripId || null;
    var entry = { view: view, tripId: state.ui.tripId, depth: replace ? depth : depth + 1 };
    try{ replace ? history.replaceState(entry, '') : history.pushState(entry, ''); }catch(e){}
    save(); render();
    window.scrollTo(0, 0);
    updateScrollState();
  }
  function goBack(){
    if (curDepth() > 0 && !(history.state && history.state.modal)){ history.back(); return; }
    navTo(PARENT_VIEW[state.ui.view] || 'home', null, true);
  }
  function openModal(m){
    rememberScroll();
    state.modal = m;
    try{ history.pushState({ view: state.ui.view, tripId: state.ui.tripId, depth: curDepth() + 1, modal: true }, ''); }catch(e){}
    render();
  }
  function closeModal(){
    if (history.state && history.state.modal){ history.back(); return; }
    state.modal = null; render();
  }
  window.addEventListener('popstate', function(e){
    var s = e.state || { view: 'home', tripId: null, depth: 0 };
    var view = s.view || 'home', tripId = s.tripId || null;
    var viewChanged = view !== state.ui.view || tripId !== state.ui.tripId;
    state.modal = null;
    state.ui.view = view;
    state.ui.tripId = tripId;
    save(); render();
    if (viewChanged){ window.scrollTo(0, s.y || 0); updateScrollState(); }
  });

  // ---------- Actions ----------
  function findItem(trip, itemId){
    for (var i=0;i<trip.items.length;i++) if (trip.items[i].id === itemId) return trip.items[i];
    return null;
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'open-new-trip'){ openModal({ type: 'newTrip' }); return; }
    if (action === 'close-modal' || action === 'close-modal-backdrop'){
      if (action === 'close-modal-backdrop' && e.target !== el) return;
      closeModal(); return;
    }
    if (action === 'open-settings'){ navTo('settings'); return; }
    if (action === 'copy-link'){
      copyToClipboard(APP_URL).then(function(){ showToast('Link copied'); }).catch(function(){ showToast('Could not copy — try selecting it manually'); });
      return;
    }
    if (action === 'share-app'){
      if (navigator.share){
        navigator.share({ title: 'Manifest', text: 'Manifest — a packing checklist app', url: APP_URL }).catch(function(){});
      } else {
        copyToClipboard(APP_URL).then(function(){ showToast('Link copied'); }).catch(function(){ showToast('Could not copy — try selecting it manually'); });
      }
      return;
    }
    if (action === 'open-master'){ navTo('master'); return; }
    if (action === 'export-master'){ openModal({ type: 'export', json: JSON.stringify({ tripTypes: state.tripTypes, master: state.master }, null, 2) }); return; }
    if (action === 'copy-export'){
      var exportJson = state.modal && state.modal.json;
      if (!exportJson) return;
      copyToClipboard(exportJson).then(function(){ showToast('Copied — paste it to Claude'); }).catch(function(){ showToast('Could not copy — select the text below'); });
      return;
    }
    if (action === 'go-back'){ goBack(); return; }
    if (action === 'open-trip'){ navTo('trip', el.getAttribute('data-id')); return; }
    if (action === 'open-edit-trip'){
      var editId = el.getAttribute('data-id');
      if (!getTrip(editId)) return;
      openModal({ type: 'editTrip', tripId: editId });
      return;
    }

    if (action === 'clone-trip'){
      var src = getTrip(el.getAttribute('data-id'));
      if (!src) return;
      var clone = { id: uid(), name: src.name + ' (copy)', tripTypeIds: (src.tripTypeIds||[]).slice(), tripTypeNames: (src.tripTypeNames||[]).slice(),
        start: todayIso(), end: addDaysIso(todayIso(), src.days - 1), days: src.days, createdAt: Date.now(),
