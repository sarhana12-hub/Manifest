        items: src.items.map(function(it){ return { id: uid(), name: it.name, category: it.category, tags: (it.tags||[]).slice(), status: 'pending' }; }) };
      state.trips.push(clone);
      navTo('trip', clone.id, state.ui.view === 'trip');
      showToast('Duplicated — dates start today');
      return;
    }
    if (action === 'delete-trip'){
      e.stopPropagation();
      var id = el.getAttribute('data-id');
      var t = getTrip(id);
      if (!t) return;
      if (!confirm('Delete "' + t.name + '"? This can\'t be undone.')) return;
      state.trips = state.trips.filter(function(x){ return x.id !== id; });
      save();
      if (state.ui.view === 'trip' && state.ui.tripId === id) goBack(); else render();
      return;
    }

    if (action === 'set-status'){
      var trip = getTrip(state.ui.tripId);
      if (!trip) return;
      var it = findItem(trip, el.getAttribute('data-item'));
      if (!it) return;
      var newStatus = el.getAttribute('data-status');
      if (it.status === 'pending' && (newStatus === 'ignored' || newStatus === 'packed')){
        if (leavingRows[it.id]) return;
        // Tracked outside the DOM so a re-render from another row's timer
        // (tapping quickly down a list) doesn't flash this row back in.
        leavingRows[it.id] = newStatus;
        var row = el.closest('.item-row');
        if (row){
          row.classList.add('row-leaving');
          if (newStatus === 'ignored') row.classList.add('to-skip');
          el.classList.add('chosen');
        }
        if (navigator.vibrate){ try{ navigator.vibrate(8); }catch(err){} }
        showToast(newStatus === 'packed' ? 'Packed: ' + it.name : 'Not needed: ' + it.name);
        ensureAudio();
        setTimeout(function(){
          delete leavingRows[it.id];
          if (it.status !== 'pending') return;
          it.status = newStatus;
          var justCompleted = tripCounts(trip).pending === 0;
          save(); render();
          if (justCompleted) celebrateTripComplete(trip);
        }, 450);
        return;
      }
      it.status = newStatus;
      save(); render(); return;
    }
    if (action === 'toggle-ledger'){
      var key = el.getAttribute('data-key');
      state.ui.openLedgers[key] = !state.ui.openLedgers[key];
      save(); render(); return;
    }
    if (action === 'add-left-off'){
      var lTrip = getTrip(state.ui.tripId);
      if (!lTrip) return;
      lTrip.items.push({ id: uid(), name: el.getAttribute('data-name'), category: el.getAttribute('data-cat'), tags: [], status: 'pending' });
      showToast('Added ' + el.getAttribute('data-name'));
      save(); render(); return;
    }
    if (action === 'accept-suggestion'){
      var sKey = el.getAttribute('data-key');
      var sName = el.getAttribute('data-name');
      var sCat = el.getAttribute('data-cat');
      var cat7 = state.master.categories.filter(function(c){ return c.name === sCat; })[0];
      if (!cat7){ cat7 = { id: uid(), name: sCat, items: [] }; state.master.categories.push(cat7); }
      cat7.items.push({ id: uid(), name: sName, tags: [] });
      state.ui.dismissedSuggestions[sKey] = true;
      showToast(sName + ' added to master list');
      save(); render(); return;
    }
    if (action === 'dismiss-suggestion'){
      var dKey = el.getAttribute('data-key');
      state.ui.dismissedSuggestions[dKey] = true;
      save(); render(); return;
    }

    if (action === 'toggle-category'){
      var cid = el.getAttribute('data-id');
      var currentlyOpen = state.ui.openCategories[cid] !== false;
      state.ui.openCategories[cid] = !currentlyOpen;
      save(); render(); return;
    }
    if (action === 'delete-master-category'){
      var mc = state.master.categories.filter(function(c){ return c.id === el.getAttribute('data-id'); })[0];
      if (!mc) return;
      if (!confirm('Delete category "' + mc.name + '" and its ' + mc.items.length + ' items? This can\'t be undone.')) return;
      state.master.categories = state.master.categories.filter(function(c){ return c.id !== mc.id; });
      save(); render(); return;
    }
    if (action === 'delete-master-item'){
      var cat3 = state.master.categories.filter(function(c){ return c.id === el.getAttribute('data-cat'); })[0];
      if (!cat3) return;
      var delItem = cat3.items.filter(function(it){ return it.id === el.getAttribute('data-item'); })[0];
      if (!delItem || !confirm('Remove "' + delItem.name + '" from your master list?')) return;
      cat3.items = cat3.items.filter(function(it){ return it.id !== delItem.id; });
      save(); render(); return;
    }
    if (action === 'toggle-item-tag'){
      var cat4 = state.master.categories.filter(function(c){ return c.id === el.getAttribute('data-cat'); })[0];
      if (!cat4) return;
      var it4 = cat4.items.filter(function(i){ return i.id === el.getAttribute('data-item'); })[0];
      if (!it4) return;
      if (!it4.tags) it4.tags = [];
      var typeId = el.getAttribute('data-type');
      var idx = it4.tags.indexOf(typeId);
      if (idx === -1) it4.tags.push(typeId); else it4.tags.splice(idx, 1);
      showToast(it4.name + ': ' + scopeLabel(it4.tags));
      save(); render(); return;
    }
    if (action === 'delete-type'){
      var typeId2 = el.getAttribute('data-id');
      var tt = getTripType(typeId2);
      if (!tt) return;
      if (!confirm('Remove trip type "' + tt.name + '"? It will be untagged from any items.')) return;
      state.tripTypes = state.tripTypes.filter(function(t){ return t.id !== typeId2; });
      state.master.categories.forEach(function(c){
        c.items.forEach(function(it){ if (it.tags) it.tags = it.tags.filter(function(t){ return t !== typeId2; }); });
      });
      save(); render(); return;
    }
  });

  // Re-renders replace the form, which would drop the keyboard after every
  // add; put focus back so several items can be typed in a row.
  function refocusAdd(action, cat){
    var forms = app.querySelectorAll('form[data-action="' + action + '"]');
    for (var i = 0; i < forms.length; i++){
      if (forms[i].getAttribute('data-cat') === cat){
        var inp = forms[i].querySelector('input');
        if (inp) inp.focus();
        return;
      }
    }
  }

  document.addEventListener('submit', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    e.preventDefault();
    var action = el.getAttribute('data-action');

    if (action === 'add-item'){
      var trip = getTrip(el.getAttribute('data-trip'));
      var cat = el.getAttribute('data-cat');
      var input = el.querySelector('input[name="itemName"]');
      var name = tidyName(input.value);
      if (!trip || !name) return;
      trip.items.push({ id: uid(), name: name, category: cat, tags: [], status: 'pending' });
      save(); render();
      refocusAdd('add-item', cat);
      return;
    }
    if (action === 'add-type'){
      var input2 = el.querySelector('input[name="typeName"]');
      var name2 = tidyName(input2.value);
      if (!name2) return;
      state.tripTypes.push({ id: uid(), name: name2 });
      save(); render(); return;
    }
    if (action === 'add-master-category'){
      var input3 = el.querySelector('input[name="catName"]');
      var name3 = tidyName(input3.value);
      if (!name3) return;
      state.master.categories.push({ id: uid(), name: name3, items: [] });
      save(); render(); return;
    }
    if (action === 'add-master-item'){
      var cat2 = state.master.categories.filter(function(c){ return c.id === el.getAttribute('data-cat'); })[0];
      if (!cat2) return;
      var fd = new FormData(el);
      var name4 = tidyName(fd.get('itemName'));
      if (!name4) return;
      var dupe = cat2.items.some(function(x){ return x.name.toLowerCase() === name4.toLowerCase(); });
      if (dupe){ showToast(name4 + ' is already in ' + cat2.name); return; }
      cat2.items.push({ id: uid(), name: name4, tags: [] });
      save(); render();
      refocusAdd('add-master-item', cat2.id);
      return;
    }
  });

  render();

  // Seed history so Back from wherever the app reopened lands on Trips.
  try{
    history.replaceState({ view: 'home', tripId: null, depth: 0 }, '');
    if (state.ui.view !== 'home') history.pushState({ view: state.ui.view, tripId: state.ui.tripId, depth: 1 }, '');
  }catch(e){}

  // iOS Safari ignores user-scalable=no for pinch; these stop it in the
  // installed app so the layout never drifts into a zoomed state.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(t){
    document.addEventListener(t, function(e){ e.preventDefault(); }, { passive: false });
  });

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      // updateViaCache:'none' makes the browser bypass HTTP caching when
      // checking sw.js for changes — GitHub Pages serves everything with
      // Cache-Control: max-age=600, which would otherwise let a stale
      // service worker sit for up to 10 minutes before an update is even
      // considered. reg.update() forces an immediate check on top of the
      // browser's own periodic one. Once a new worker actually takes
      // control, reload once so the update shows without a manual
      // force-quit-and-reopen.
      // Only reload for a genuine update — on the very first visit the new
      // worker claiming the page also fires controllerchange.
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg){
        reg.update();
        var reloaded = !hadController;
        navigator.serviceWorker.addEventListener('controllerchange', function(){
          if (reloaded) return;
          reloaded = true;
          location.reload();
        });
      }).catch(function(){});
    });
  }
})();
</script>
